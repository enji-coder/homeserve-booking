databases:
  - name: homeserve-db
    plan: free
    databaseName: homeserve
    user: homeserve
    region: singapore

services:
  - type: web
    name: homeserve
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeserve-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
