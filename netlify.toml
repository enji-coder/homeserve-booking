[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://homeserve.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://homeserve.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "https://homeserve.onrender.com/docs"
  status = 200
  force = true

[[redirects]]
  from = "/docs/*"
  to = "https://homeserve.onrender.com/docs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/redoc"
  to = "https://homeserve.onrender.com/redoc"
  status = 200
  force = true

[[redirects]]
  from = "/swagger"
  to = "https://homeserve.onrender.com/docs"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.json"
  to = "https://homeserve.onrender.com/openapi.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
